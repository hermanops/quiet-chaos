log_level = "info"
json_logs = true
# run_for_seconds is omitted for continuous operation.
request_timeout_seconds = 8.0
# Reject HTTP bodies exceeding this many wire or decoded bytes; oversized bodies are not retried.
max_response_bytes = 1000000
max_links_per_page = 30
visited_url_cache_size = 5000
failure_cooldown_threshold = 3
failure_cooldown_seconds = 300.0
failure_cache_size = 1000
max_request_retries = 1
retry_backoff_seconds = 1.0
seed_reinjection_probability = 0.1
modes = ["http", "dns", "rss", "search", "assets"]

# deny_domains, seed_urls and search_queries inherit the built-in defaults.
# Seeds and queries include science, current-event and AI topics.
# Rebuilding with updated source picks up new defaults unless overridden here.
# Non-public IP addresses are blocked independently of the deny list.

[[seed_sources]]
kind = "tranco_zip"
url = "https://tranco-list.eu/top-1m.csv.zip"
limit = 500
refresh_hours = 24

[trend_sources]
# Use the token-free Tranco and Cisco Umbrella sources by default.
enabled = true

[user_agent_source]
enabled = false

[pacing]
enabled = true
idle_min_seconds = 0.25
idle_max_seconds = 2.0
long_pause_probability = 0.02
long_pause_min_seconds = 60.0
long_pause_max_seconds = 300.0
max_pause_seconds = 300.0
# Omit timezone to use the container's local timezone, which may differ from the host's.
# Set an IANA zone explicitly for a predictable day/night schedule.
# timezone = "Europe/Amsterdam"
diurnal_enabled = true

[stats_log]
enabled = true
interval_seconds = 300

[health]
enabled = true
# Bind inside Docker; the host Compose file publishes on localhost only.
host = "0.0.0.0"
port = 8080
allowed_hosts = []
# Set QUIET_CHAOS_HEALTH_TOKEN in the environment; Compose also passes it to health probes.

[telemetry]
enabled = false
service_name = "quiet-chaos-srv"
# Requires the otel extra and an optional OTEL_EXPORTER_OTLP_ENDPOINT environment setting.
