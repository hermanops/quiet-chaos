log_level = "info"
json_logs = true
# Stop after one hour; omit this setting for continuous operation.
run_for_seconds = 3600
request_timeout_seconds = 8.0
# Reject HTTP bodies exceeding this many wire or decoded bytes; oversized bodies are not retried.
max_response_bytes = 1000000
max_links_per_page = 30
visited_url_cache_size = 5000
failure_cooldown_threshold = 3
failure_cooldown_seconds = 300.0
failure_cache_size = 1000
max_request_retries = 1
retry_backoff_seconds = 1.0
seed_reinjection_probability = 0.1
modes = ["http", "dns", "rss", "search", "assets"]

seed_urls = [
  "https://www.wikipedia.org/",
  "https://www.bbc.com/",
  "https://www.mozilla.org/",
  "https://www.nasa.gov/",
  "https://www.britannica.com/",
  "https://www.si.edu/",
  "https://www.python.org/",
  "https://www.theguardian.com/",
  "https://huggingface.co/",
  "https://openai.com/",
  "https://www.anthropic.com/",
  "https://deepmind.google/",
]

# Omit deny_domains to inherit the built-in list. An explicit list replaces it.
# Non-public IP addresses are blocked independently of the deny list.

# Search mode uses Wikipedia OpenSearch, not a general web search engine.
# Prefer short article topics; mix evergreen interests with recent events.
# Recent topics checked 2026-11-01; this list does not refresh automatically.
# Sources: https://www.nobelprize.org/all-nobel-prizes-2026/
#          https://www.python.org/downloads/release/python-3150/
search_queries = [
  "Open-source software",
  "Public library",
  "James Webb Space Telescope",
  "Grid energy storage",
  "IceCube Neutrino Observatory",
  "Francis Halzen",
  "Neutrino astronomy",
  "Optogenetics",
  "Karl Deisseroth",
  "Asymmetric synthesis",
  "Soai reaction",
  "Anne Carson",
  "Python (programming language)",
  "Generative artificial intelligence",
  "Large language model",
  "Retrieval-augmented generation",
  "Multimodal learning",
  "AI safety",
  "ChatGPT",
]

[[seed_sources]]
kind = "tranco_zip"
url = "https://tranco-list.eu/top-1m.csv.zip"
limit = 500
refresh_hours = 24

[[seed_sources]]
kind = "crux_gzip_csv"
url = "https://raw.githubusercontent.com/zakird/crux-top-lists/main/data/global/current.csv.gz"
limit = 500
refresh_hours = 24

[trend_sources]
# Discovery is separate from the seed sources above and is disabled by default.
enabled = false
refresh_hours = 24
pool_size = 30
lookback_days = 28
tranco_limit = 10000
umbrella_enabled = true
majestic_enabled = false
# Set QUIET_CHAOS_RADAR_TOKEN in the environment for Cloudflare Radar.
# Optional monthly CrUX signal (never used as weekly momentum):
# crux_url = "https://raw.githubusercontent.com/zakird/crux-top-lists/main/data/global/current.csv.gz"
allow_domains = []
deny_domains = []
allow_categories = []
deny_categories = []
daily_domain_requests = 3
daily_requests = 100
daily_response_bytes = 26214400
# Optional operator-assigned categories:
# [trend_sources.categories]
# "example.com" = ["news"]

[user_agent_source]
enabled = false
url = "https://www.useragents.me"
limit = 50
refresh_hours = 168

[pacing]
enabled = true
idle_min_seconds = 0.25
idle_max_seconds = 2.0
long_pause_probability = 0.02
long_pause_min_seconds = 60.0
long_pause_max_seconds = 300.0
max_pause_seconds = 300.0
diurnal_enabled = false
# Optional IANA timezone; omit to keep the runtime's local timezone.
# timezone = "Europe/Amsterdam"

[stats_log]
enabled = true
interval_seconds = 300

[health]
enabled = true
# Bind inside Docker; Compose publishes this on host localhost only.
# For direct local execution, use "127.0.0.1" instead.
host = "0.0.0.0"
port = 8080
# Additional exact Host names accepted through an intentional reverse proxy.
allowed_hosts = []
# Set QUIET_CHAOS_HEALTH_TOKEN in the environment to require Authorization: Bearer <token>.

[telemetry]
enabled = false
service_name = "quiet-chaos"
# Install the otel extra; configure the HTTP collector with OTEL_EXPORTER_OTLP_ENDPOINT.
