[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "quiet-chaos"
version = "0.1.0"
description = "A bounded, observable HTTP/DNS traffic noise generator for personal privacy experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "hermanops" }]
keywords = ["privacy", "traffic", "dns", "docker", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "dnspython>=2.9.1",
  "feedparser>=6.0.14",
  "httpx[http2]>=0.28.1",
  "pydantic>=2.14.2",
  "typer>=0.27.3",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.45.2",
  "opentelemetry-exporter-otlp>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "respx>=0.23.1",
  "ruff>=0.17.3",
  "semgrep>=1.183.0",
]

[project.scripts]
quiet-chaos = "quiet_chaos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quiet_chaos"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
