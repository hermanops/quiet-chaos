services:
  quiet-chaos:
    build: .
    image: quiet-chaos:local
    restart: unless-stopped
    cap_drop: ["ALL"]
    environment:
      - QUIET_CHAOS_HEALTH_TOKEN
    command:
      ["run", "--config", "/app/config.toml", "--cache-dir", "/home/nonroot/.cache/quiet-chaos"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "from quiet_chaos.health import check_health; check_health()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - quiet-chaos-cache:/home/nonroot/.cache/quiet-chaos

volumes:
  quiet-chaos-cache:
